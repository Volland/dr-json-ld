schema: spec-driven

context: |
  # jsonld-modeler

  A VS Code extension and CLI for authoring JSON-LD contexts as a reviewable YAML
  model, viewing them as two coordinated diagrams — the JSON tree a developer types
  and the RDF graph it denotes — and generating the `@context` plus its downstream
  artifacts from a single model. Sibling to `lpg-modeler`, which does the same job
  for Labeled Property Graph schemas.

  The authoritative design record lives in `lat.md/` and is validated by `lat check`.
  Read it before proposing anything: `lat locate "<Section>"`, `lat refs "<file>#<Section>"`.
  Key sections: architecture#Source of Truth, architecture#Package Boundary,
  architecture#Roadmap, metamodel#Terms, metamodel#Identity, metamodel#Examples,
  processing#Expansion, processing#Source Mapping, processing#Context Resolution,
  validation#The Ladder, emitters#Capability Matrix, emitters#Context Target.

  ## Tech stack

  TypeScript throughout. npm workspace monorepo with three packages:
    - `core`    parsing, IR, resolution, the JSON-LD processor, validation, all
                emitters. MUST NOT import `vscode` (lint-enforced) so it runs in CI
                and in plain Node tests.
    - `cli`     wraps core for continuous integration (`ldm check | emit | import`).
    - `vscode`  webview and diagnostics plumbing only.

  Models are YAML validated by a JSON Schema contributed via `contributes.jsonValidation`.
  In-place edits use the `yaml` package Document API so comments, key order, and
  formatting survive a round trip. Canvas is React Flow (`@xyflow/react`, MIT) with
  ELK auto-layout (`elkjs`, EPL-2.0). Conformance is checked against the W3C JSON-LD
  1.1 test suite with `jsonld.js` as a differential oracle.

  ## Domain vocabulary

  Use these terms exactly; do not invent synonyms.
    model             a YAML file declaring a namespace, terms, examples and shapes
    IR                resolved intermediate representation; input to every emitter,
                      to the canvas and to validation
    term              a mapping from a JSON key to an IRI, plus its JSON-LD facets
    facet             one JSON-LD keyword on a term (@id, @type, @container,
                      @language, @protected, @context, @nest, @reverse, @prefix,
                      @direction)
    terms layer       the part of a model that is mechanically context-shaped
    shapes layer      class-level structure: membership, cardinality, ranges,
                      open/closed. Not expressible in a context
    shape             one class-level structural declaration
    example           a declared document with an expected validation outcome
    element id        short generated stable identifier on every term, shape, example
    namespace         a model's prefix plus base IRI; the global identity of its terms
    processing mode   1.0 or 1.1, declared per model; decides which facets are legal
    active context    the JSON-LD processing state at a point in a document
    scoped context    a context attached to a term or a type, changing the active
                      context below that point
    expansion         the JSON-LD algorithm producing the expanded document form
    compaction        the inverse of expansion against a context
    trace             the ordered record of algorithm steps for one expansion
    source map        the JSON Pointer trail from an expanded node back to its input
    finding           one validation result: a rule id, a level, a severity, a pointer
    level             a rung of the validation ladder, L0 to L4
    rule              a catalogued lint with a stable id, severity and explanation
    vendored context  an external context fetched once, hash-pinned and committed
    view              a named subset of a model forming one pair of diagrams
    pane              one of the canvas's two coordinated representations: tree, graph
    layout sidecar    diagram coordinates, keyed by element id, nested per view per pane
    target            a generation destination (context, context-inline, shacl, frame,
                      jsonschema, vocabulary, types, docs)
    emitter           IR to artifact for one target
    capability        a typed declaration of what a target can express
    downgrade         a model fact a target cannot express; reported as a diagnostic
    lockfile          canonical stable-ordered IR snapshot committed for diffing
    change class      additive | compatible | breaking | semantic | illegal
    host adapter      the interface the webview uses to reach whatever hosts it

  ## Locked decisions - do not relitigate without an explicit new proposal

  1.  The tool is an authoring tool. Validation, visualization, conversion and
      explanation exist to serve authoring, not as products in their own right.
  2.  The YAML model is canonical and holds semantics only. The `@context` is an
      emitted artifact. Layout is a separate sidecar so rearranging a diagram never
      dirties the semantic diff. A project file is a second canonical file kind: it
      says which models belong together and where output goes, and holds no
      semantics of its own. A published version is emitted, never authored.
  3.  An external context is referenced live by default, keeping the array form that
      JSON-LD's own model of composition assumes. Inlining a flattened snapshot is a
      separate target that reports the fork as a downgrade.
  4.  The metamodel has two layers. `terms:` is mechanically context-shaped and
      emits 1:1. `shapes:` carries structure a context cannot express. Every model
      fact records which artifacts carry it; a fact no target can carry is a
      downgrade at its site, never a silent omission.
  5.  The metamodel covers all of JSON-LD 1.1. A model declares its processing mode;
      using a 1.1-only facet while targeting 1.0 is a downgrade diagnostic. Coverage
      is total, visual prominence is curated.
  6.  Validation is a ladder of five levels, L0 to L4. A real SHACL engine is the
      authority at L3, running the same SHACL the tool emits. Every finding carries
      a JSON Pointer and a line/column into the user's own document.
  7.  Expansion and compaction are implemented here, carrying provenance through
      every step. Framing, URDNA2015 canonicalization and N-Quads serialization are
      delegated. Conformance is the W3C JSON-LD 1.1 test suite plus a differential
      test against `jsonld.js`, never assertion.
  8.  RDF to JSON-LD is a core conversion: `fromRdf` followed by compaction against
      the model's own context, so the result is idiomatic rather than raw.
  9.  No artifact ships that is only snapshotted. Every emitted artifact is executed
      by an independent implementation of its own standard. Golden files exist to
      detect unintended churn, never to prove correctness.
  10. External contexts are vendored, hash-pinned and committed. Every command
      except an explicit refresh runs with the network off. A hash mismatch is a
      hard error.
  11. Element id is identity. The JSON key and the IRI are both mutable attributes of
      it, and they mean different things: a key change breaks consumers' documents
      while changing no RDF, an IRI change alters meaning while every document still
      parses. Renames are detected via ids, never inferred from similarity.
  12. Changes against the lockfile are classified `additive`, `compatible`,
      `breaking`, `semantic` or `illegal`. Removing a protected term is illegal.
      An ambiguous direction classifies as `breaking`. Implemented rather than
      amended by `add-project-versioning-and-publishing`; the lockfile lives
      inside a version, so two past releases can be compared and not only the
      present against one past.
  13. Examples are declared in the model, stored as their own files, and carry an
      expected outcome. A negative example names the finding ids it must produce.
      The model is self-testing in CI.
  14. The canvas is two coordinated panes over one model — a JSON-shape tree and an
      RDF graph — sharing one selection model. A facet that exists on only one side
      is visibly absent on the other. The gap between the two is the subject of the
      tool, not an inconvenience.
  15. The webview is written against a host adapter interface. VS Code is one
      implementation; a hosted playground would be a second, not a rewrite.
  16. The guidance catalog is deterministic: every rule has a stable id, a severity,
      a why, a bad/good pair and a link into the explanation corpus. An LLM layer is
      optional and clearly labelled, and never produces a diagnostic, an edit or a
      CI result.
  17. `core` must never import `vscode`, enforced by lint and by a test that scans
      the source.
  18. The repository is its own, separate from `lpg-modeler`. Proven, narrow,
      stable machinery is shared through an extracted package — YAML targeted
      splicing, element ids, the layout sidecar, the capability framework. Emitters
      are not shared: the IRs differ and a common IR would distort both.

  ## Milestones

  M1 (change `add-jsonld-context-modeler`) is a thin vertical slice: every
  architectural seam exercised once before anything is built on top of it.

  M1 IN:  the terms layer and its JSON Schema; parse, resolve, validate; own
          expansion and compaction with source mapping and trace; validation L0-L2;
          emit `context` and `context-inline`; import an existing context;
          vendored hash-pinned context resolution; examples with expected outcomes;
          the dual-pane canvas with the layout sidecar and views; CLI `check`,
          `emit`, `import`, `vendor`.

  M1 SHIPPED: all of the above, plus `ldm ids` and `ldm explain --trace`, which
          the plan implied but did not list. Nothing planned was dropped. The
          processor is complete in surface and incomplete in conformance - see
          "Measured behaviour" for the pass rates and the named gaps. Closing
          those gaps is ordinary work against the existing ratchets, not a new
          milestone.

          Worth moving forward, because M1 measured its cost as lower than
          assumed: the W3C suite harness and the differential oracle are already
          general over a named suite class, so frame, toRdf and fromRdf
          conformance becomes a fixture-and-ratchet change rather than a build.
          It still waits on the algorithms themselves, which stay deferred.

          No locked decision was amended. Decision 9 was tested hardest: an
          emitted artifact must be executed by an independent implementation,
          and the capability matrix also wants a comment at the lossy position.
          JSON cannot hold a comment, so the artifact is JSON with `//` lines and
          the execution test strips them. The decision stands; what it costs is
          now recorded under "Measured behaviour".
  M1 OUT: the shapes layer, SHACL, frame, JSON Schema, vocabulary document, TS
          types, docs site, RDF import, the lockfile and change classifier, the
          lint catalog and explanation corpus, the LLM layer, the extracted shared
          package.

  M2: the shapes layer, the SHACL target, validation L3 executed by a real engine,
      and the instance-graph overlay. It is the unblocker for every remaining
      emitter and it completes the validation promise.

  M3+: frame and JSON Schema as a pair, the vocabulary document, TS types and the
      docs site, RDF import, the guidance catalog, and the extracted shared
      package once duplication with `lpg-modeler` has shown where the seam
      actually falls.

      MOVED OUT by `add-project-versioning-and-publishing`: the lockfile and the
      change classifier now ship. An immutable version whose difference from its
      predecessor cannot be named is a filing system rather than a release
      process, so the two arrived together. `ldm diff --fail-on` gates a pull
      request on the class today.

      CHEAPER THAN ASSUMED, per the same change: a host adapter is a declared
      constraint set rather than a deployment procedure, so a fourth host is a
      table entry rather than a feature. Uploading stays out - every host has a
      mature tool for it, and credentials are not this tool's business.

  Deferred is not cancelled. Every deferred item is accounted for in `lat.md/` and
  must stay reachable from the design. The lockfile now exists and lives inside a
  version; the IR serializer's stable key order, written for it, is what made
  adding it disturb nothing. Nothing may assume a shapes layer exists, but the
  terms layer must not occupy names it will need.

  ## Open questions - resolve in the proposal that first needs them

  These were identified during design and deliberately left open. A change that
  touches one must settle it explicitly rather than assume.

  - A term is global to a context; cardinality is local to a class. When two shapes
    use one term with different cardinality, shapes own cardinality and terms own
    coercion - but the metamodel spec must say so before M2 begins.
  - How a scoped context is created on the canvas, as opposed to how it is drawn.
  - Whether named graphs and `@graph` are in the metamodel at all.
  - SETTLED by `add-jsonld-context-modeler`: the two panes do **not** share a
    layout sidecar. The tree pane persists no coordinates - its layout is derived
    entirely from structure - so the sidecar holds graph-pane positions only,
    keyed by element id and nested per view. A change that first wants a
    persisted tree-pane position must reopen this rather than assume an answer.
  - The aggregation strategy for an instance graph over a large payload.
  - Where the extracted shared package lives once it exists.
  - SETTLED by `add-project-versioning-and-publishing`: the publishing strategy is
    versioned static paths plus movable aliases, and no content negotiation. A
    version is reachable at a path carrying its identity and an alias at a path
    carrying its name; both return the same bytes. The tree must serve from a
    dumb file host, so anything needing a rewrite rule or server-side negotiation
    is refused at publish time rather than discovered in production. The guidance
    catalog can now advise on this.

  ## Measured behaviour - do not re-assert from memory

  Record here what was observed rather than what the specification was expected to
  imply. Full per-case reports are regenerated by the test run into
  `docs/conformance/{expand,compact,differential}.md`; this section holds the
  conclusions.

  ### W3C JSON-LD 1.1 suite, as of change `add-jsonld-context-modeler`

  Suite vendored from `w3c/json-ld-api` under
  `packages/core/test/fixtures/w3c/`, run with the network off.

    expand    336 of 376 attempted pass (9 skipped: 1.0 processing mode, or a
              feature the milestone does not implement)
    compact   166 of 235 attempted pass (11 skipped, same reasons)

  Each suite has a ratchet constant in its test file. The ratchet exists so an
  unexplained regression fails the build; raising it is a deliberate act that
  accompanies a fix, never a way to make a red build green.

  Known remaining expand gaps, by cause rather than by case:
    - Several type-scoped context reversion cases still differ. The
      `previousContext` mechanism is implemented, but the interaction between a
      type-scoped context and a property-scoped context nested inside it is not
      yet right (`tc012`, `tc019`, `tc024`, `tc028`).
    - `@import` inside a scoped context is not resolved, because scoped contexts
      deliberately do not follow remote references at definition time
      (`tso05`, `tso06`).
    - Protected-term override via `@protected: false` in a later context is not
      implemented (`tpr13`, `tpr25`).

  Known remaining compact gaps: reverse-map key compaction under `@vocab`, and
  index-map round-tripping where the index property is itself a term.

  ### Divergences from `jsonld.js`

  Measured over every positive expand case both implementations accept: 256 agree,
  17 diverge. Each divergence was adjudicated against the suite's own expected
  document, which is the authority.

    This project is right, `jsonld.js` is wrong:
      - `#t0038` Expanding blank node labels.
      - `#tc037` Property-scoped contexts which are an alias of `@nest`. A scoped
        context on a term whose `@id` is `@nest` must apply to the nested entries;
        `jsonld.js` does not apply it.

    `jsonld.js` is right, this project is wrong: the 14 cases listed under the
    remaining gaps above. Each is a gap rather than a disagreement about the
    specification.

    Neither matches the expected document: `#tc038` (Bibframe example). Unresolved;
    it exercises several scoped-context interactions at once and is not a useful
    first case to chase.

  ### Observations about the algorithms themselves

    - A compact IRI must be tried against the declared prefixes *before* the
      absolute-IRI test. `schema:name` satisfies both readings, and testing for an
      absolute IRI first silently mints `schema:name` as its own scheme.
    - `@vocab` must be IRI-expanded like any other value. `@vocab: "ex:ns/"` names a
      prefix and `@vocab: ""` names the base; keeping either verbatim mints IRIs
      nobody serves.
    - A scoped context is processed against the context in force where the term is
      *used*, not where it was defined. Using the defining context stops scoped
      contexts layering on the intermediate contexts between the two.
    - In compaction, array-ness is a property of the selected term, never of how
      many values the source property carried — several values under one property
      may select several different terms.
    - A default `@language` applies to strings only; a number or boolean must still
      compact to a scalar.
    - In compaction, a candidate compact IRI that is already a defined term is
      safe in an `@id` position and unsafe in a property position: there the term
      may carry a coercion that does not apply to the value being compacted.

  ### Emitters, as built

    - An emitted `@context` must be loadable by an independent implementation,
      and the capability matrix requires a comment at the lossy position. JSON has
      no comments, so the artifact is JSON with `//` lines and the execution test
      strips them before handing it to `jsonld.js`. The two requirements are in
      genuine tension; this resolves it in favour of the artifact staying
      readable in place, and pays for it by verifying the stripped form.
    - `context-inline` was run against `jsonld.js` on every fixture example and
      round-trips them; the flattening therefore loses nothing the referenced
      form carries, which is what makes the downgrade purely about upstream
      drift rather than about expressiveness.
    - Import cannot invent a namespace, because a `@context` does not state one.
      It is inferred from `@vocab`, then from the commonest declared prefix, and
      the fallback is deliberately `https://example.invalid/ns#` so nobody ships
      it by accident.
    - Import then emit is semantically equal to the input but never byte-equal:
      key order and shorthand forms are not preserved. Import-emit-import-emit
      *is* byte-equal, and that is the property worth asserting.

  ### Versioning and publishing, as built

    - A version's identity cannot be the hash of its manifest. The artifacts name
      the version they belong to, the manifest hashes those artifacts, and the
      identity comes from the manifest - which does not converge, because writing
      the id changes the bytes that determine it. Identity is therefore a hash
      over the *inputs* (model, lockfile, examples); the manifest still hashes
      every file and itself, for verification. This was found in implementation,
      not in design, and the design decision was rewritten rather than worked
      around.
    - A clone has its origin's inputs and its own identity, so its artifacts are
      the origin's with one header line retargeted. Copying them verbatim would
      serve a file at the clone's path claiming to be the origin.
    - Host path constraints are a backstop, not the first line of defence: the
      alias and project-model name patterns already refuse a leading underscore
      and anything unsafe in a URL. The publish-time check is still worth having
      because it is the only thing that would catch a loosened name pattern.
    - GitHub Pages needs `.nojekyll` at the tree root, because Jekyll silently
      drops any path segment beginning with `_` or `.`. S3 needs every key to
      carry an extension, because a bucket cannot infer an index document for an
      arbitrary prefix. Both are declared by their adapters rather than assumed.
    - Every adapter this build knows copies an artifact to its alias path rather
      than writing a redirect. A redirect a host does not honour fails silently,
      which is worse than a duplicated file that is a few kilobytes.
    - Two code paths needed the self-published resolver chained in front of the
      vendored one - creating a version, and checking a project. Both were found
      by a fixture that referenced a sibling's published version, not by reading
      the code.

  ### Observations about the canvas

    - A node inside an `@id` map is expanded before the map key reaches it, so it
      looks like a blank node on the way through. The observation is retracted
      when the container supplies the identifier; reporting it would be a false
      positive exactly where a container is doing its job.
    - "The model file is unparseable" must key off YAML parse errors, not off
      whether resolution produced an IR. A model with an unknown prefix still has
      a diagram worth drawing; a file mid-keystroke does not.

  ### The schema and the skills, as built

  From `add-authoring-skills-and-published-schema`. No locked decision was
  amended. Decision 16 was the one under pressure and it held: a skill is a
  static document that produces no finding, no edit and no exit code, and that
  is asserted - `ldm check` gives identical findings and the identical exit code
  with skills installed and absent. The in-product LLM layer stays in M1 OUT;
  this ships no inference. No open question was settled and nothing moved
  between the milestone lists: the `docs` in "TS types and the docs site" is the
  generated-documentation *target*, not this project's own website, so the
  schema reference page is not that item arriving early.

    - Three of the five facet co-constraints originally specified were wrong
      about JSON-LD, and were found by reading the processor before writing the
      schema rather than by a failing test. `@language` beside a `@type`
      coercion is legal - Create Term Definition step 22 reads `@language` only
      when `@type` is absent, so the language is *ignored*, and
      `L1.invalid-language-mapping` never fires for it. `@reverse` excludes
      `@id` and `@nest`, not `@type`. And a 1.1 facet in a `mode: "1.0"` model
      is a downgrade at warning severity, so a schema refusing it would have
      relitigated decision 5 by way of a JSON file.
    - The rule that came out of it: the schema's reach is bounded by what makes
      `ldm check` exit non-zero, never by what looks wrong. A warning names a
      model the tool accepts, so a warning may not correspond to a schema
      rejection. This is asserted in both directions over the corpus.
    - Hand-written cases prove a constraint fires and cannot prove it fires on
      exactly the right set. An over-strict schema refusing a legal model is the
      worse failure and is the one nobody writes a case for. So the container
      constraint is checked against the resolver's own answer over all 127
      subsets of the container values, which is cheap and total.
    - Ajv reports `schemaPath` relative to whatever subschema a `$ref` resolved
      to, so a failure inside `#/$defs/term` arrives as `#/additionalProperties`
      with the name gone. A reject case therefore establishes blame by resolving
      the named `$defs` entry and running it directly, not by reading an error.
    - `raw` is exempt from the co-constraints at the schema level and is not an
      escape from the command: the resolver merges it into the emitted
      definition and the processor still reads it. A model putting illegal
      JSON-LD in `raw` is refused - later, and refused. That split is why the
      exemption is asserted at the schema level and cannot be an accept-corpus
      case.
    - `@propagate` is a *context* entry, not a term-definition entry, and the
      processor correctly refuses it on a term as `L1.invalid-term-definition`.
      The scenario in `model-format` describing `@propagate` carried through
      `raw` therefore does not hold and predates this change. Left alone rather
      than fixed in passing; it wants its own delta.
    - The old schema `$id` named a host the project does not serve, so every
      editor outside the extension validated against a 404. A schema whose
      identifier is not the URL it answers at is worse than an unpublished one,
      because each `$ref` inside it resolves against the wrong base - hence the
      deploy-time assertion that the two match.
    - The site copy adds a third way to be wrong that nothing else notices: the
      Pages workflow fires only on `site/**`, so a schema edited in `core` and
      not mirrored there deploys nothing and leaves the published URL serving
      the old rules. The copy-identity test runs in the CI workflow for that
      reason, not only where the site is built.
    - `--project` is a value-taking flag elsewhere in the CLI, so the shared
      parser swallowed the argument in `ldm skill install --project <name>` and
      installed everything. Found by running the binary, not by a unit test. The
      value is reclaimed as a skill name, since `ldm skill` accepts no project
      path.
    - `homedir` moved into the CLI's `Io` seam for the same reason `cwd` is
      there: a verb that writes outside the working directory has to be testable
      without writing into the home directory of whoever runs the suite.

rules:
  proposal:
    - State which locked decision the change touches, or state that it touches none.
    - Reworking a locked decision is allowed but must be argued explicitly, naming the
      decision number and what new information invalidates it.
    - Always include a "Non-goals" section.
    - Say which targets are affected (context, context-inline, shacl, frame,
      jsonschema, vocabulary, types, docs).
    - If the change is in the M1 OUT list, say why it is being pulled forward.
    - If the change settles one of the open questions above, say which.
    - Keep under 500 words.

  specs:
    - Write requirements in the domain vocabulary above; do not introduce synonyms.
    - Describe observable behavior of the model, the IR, a finding, or a generated
      artifact - never internal function names.
    - A requirement about generated output must state the target it applies to.
    - A requirement about validation must state the level and the rule id.
    - Behavior a target cannot express is a downgrade requirement rather than an
      omission. Say what diagnostic is raised and what appears in the output.
    - A requirement about the processor must say how conformance is observed.

  design:
    - Say whether the metamodel changes. If it does, lead with that - it is the least
      reversible decision and everything downstream depends on it.
    - Any new target must state its capability set and every downgrade it implies.
    - Any change to the IR must state the effect on the lockfile and on diffing, even
      while the lockfile is deferred.
    - Any change to term naming or namespaces must state the effect on IRI stability
      and on rename detection.
    - Any change to the processor must state the effect on the source map and on the
      trace, and name the W3C suite classes it touches.
    - Cite the `lat.md/` sections the design depends on by full section id.
    - Note which package the work lands in; if it lands in `core`, confirm no `vscode`
      import is introduced.

  tasks:
    - Break tasks into chunks of max 2 hours.
    - Processor work requires a conformance task running the relevant W3C suite class
      and a differential task against `jsonld.js`.
    - Emitter work requires a golden-file task AND an execution task in which an
      independent implementation of that standard consumes the output.
    - Any work that produces findings requires a negative-example task.
    - Include a task to update the affected `lat.md/` sections.
    - The final task is always `lat check`.

operations:
  apply:
    guidance:
      - Update `lat.md/` in the same change as the code, never afterwards.
      - Run `lat check` before reporting the change complete; it must pass.
      - Do not add a `vscode` import to `core`, even transitively through a shared util.
      - When a target cannot express something, add a capability entry and a
        diagnostic. Do not silently drop it and do not widen the metamodel to avoid it.
      - A finding without a source pointer is not finished. The pointer is the feature.
      - Never add a network call to a command other than an explicit refresh.
      - Keep test summaries concise; report failures with the actual output.

  archive:
    guidance:
      - Summarize the archive outcome before finishing.
      - Record any locked decision this change amended, and update the config context.
      - Record anything measured about the processor, an engine or a real-world
        context in the "Measured behaviour" section.
      - Note anything discovered that should move between the milestone lists, and
        any open question the change settled.
