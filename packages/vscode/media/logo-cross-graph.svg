<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"
     role="img" aria-labelledby="cgTitle cgDesc">
  <title id="cgTitle">JSON-LD Modeler</title>
  <desc id="cgDesc">A medical cross built from five graph nodes and their edges, lettered L D.</desc>

  <defs>
    <linearGradient id="cgTile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2A7DEE"/>
      <stop offset="1" stop-color="#0B3D8F"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#cgTile)"/>

  <!-- Four edges from one hub: a cross that is also the simplest graph there is. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
    <path d="M64 34 V94"/>
    <path d="M34 64 H94"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="64" cy="30" r="10"/>
    <circle cx="64" cy="98" r="10"/>
    <circle cx="30" cy="64" r="10"/>
    <circle cx="98" cy="64" r="10"/>
  </g>
  <circle cx="64" cy="64" r="13" fill="#FFFFFF"/>
  <circle cx="64" cy="64" r="6" fill="#0B3D8F"/>

  <!-- The letters take the quadrants the cross leaves empty, drawn as paths. -->
  <g fill="none" stroke="#A8D0FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 26 V42 H37"/>
    <path d="M87 86 V102"/>
    <path d="M87 86 C97 86 97 102 87 102"/>
  </g>
</svg>
