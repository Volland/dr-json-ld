# raises: L1.shape-field-ambiguous
# `label` means ex:label on its own, but ex:publisherLabel when a Labelled is
# reached through `publisher`, whose scoped context redefines it.
jsonld: "1"
namespace:
  prefix: ex
  base: https://example.org/ns#
mode: "1.1"
prefixes:
  xsd: http://www.w3.org/2001/XMLSchema#
terms:
  Book: { id: boo001, "@id": ex:Book }
  label: { id: lab001, "@id": ex:label }
  publisher:
    id: pub001
    "@id": ex:publisher
    "@type": "@id"
    "@context":
      label: { id: lab002, "@id": ex:publisherLabel }
shapes:
  Book:
    id: shp001
    targetClass: Book
    fields:
      publisher: { range: { shape: Labelled } }
  Labelled:
    id: shp002
    fields:
      label: { min: 1 }
