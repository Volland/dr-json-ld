# yaml-language-server: $schema=https://volland.github.io/dr-json-ld/schemas/model/1/model.schema.json
#
# A degree credential in the shape of Verifiable Credentials 2.0, for trying
# the shapes layer. The class carries a protected type-scoped context — its
# keys are terms of their own, with ids — and three shapes say which fields a
# credential, its subject and the degree have. `ldm check` runs these examples
# through L3; `ldm emit --target shacl` writes the shapes graph that does it.
#
# This file is *about* JSON-LD; it is not itself JSON-LD.

jsonld: "1"
project: credential
namespace:
  prefix: cred
  base: https://example.org/credentials#

mode: "1.1"

prefixes:
  xsd: http://www.w3.org/2001/XMLSchema#
  schema: https://schema.org/

terms:
  id:
    id: tid001
    "@id": "@id"
  type:
    id: tty001
    "@id": "@type"

  # The class carries its own protected context: below a node of this type,
  # these keys mean what the credential data model says they mean.
  VerifiableCredential:
    id: vcr001
    "@id": cred:VerifiableCredential
    "@context":
      "@protected": true
      issuer: { id: iss001, "@id": cred:issuer, "@type": "@id" }
      validFrom: { id: vfr001, "@id": cred:validFrom, "@type": xsd:dateTime }
      credentialSubject: { id: csu001, "@id": cred:credentialSubject, "@type": "@id" }
      evidence: { id: evi001, "@id": cred:evidence, "@type": "@id" }

  UniversityDegree:
    id: udg001
    "@id": cred:UniversityDegree

  DocumentVerification:
    id: dvf001
    "@id": cred:DocumentVerification

  degree:
    id: deg001
    "@id": cred:degree
    "@type": "@id"

  name:
    id: nam001
    "@id": schema:name

shapes:
  Credential:
    id: shc001
    targetClass: VerifiableCredential
    note: Every credential names who issued it, when it becomes valid, and whom it is about.
    fields:
      issuer: { min: 1, max: 1, range: iri }
      validFrom: { min: 1, max: 1, range: xsd:dateTime }
      credentialSubject: { min: 1, range: { shape: DegreeSubject } }
      evidence: { range: { class: DocumentVerification } }

  # No target class: a credential's subject is an untyped node, reached only
  # through `credentialSubject`.
  DegreeSubject:
    id: shs001
    fields:
      name: { max: 1, range: xsd:string }
      degree: { min: 1, max: 1, range: { shape: Degree } }

  Degree:
    id: shd001
    targetClass: UniversityDegree
    closed: true
    fields:
      name: { min: 1, max: 1 }

examples:
  - id: exc001
    path: documents/credential-ok.json
    note: A degree credential that satisfies every shape.
    expect: { ok: true, maxSeverity: info }

  - id: exc002
    path: documents/credential-missing-issuer.json
    note: Every credential must say who issued it.
    expect: { rules: [L3.min-count] }

  - id: exc003
    path: documents/credential-bad-date.json
    note: validFrom is coerced to xsd:dateTime, so "yesterday" is an ill-typed literal.
    expect: { rules: [L3.datatype] }

  - id: exc004
    path: documents/credential-subject-without-degree.json
    note: The violation is inside the nested subject, and is reported there.
    expect: { rules: [L3.min-count, L3.node] }

views:
  - id: vwc001
    name: Credential
    terms: [id, type, VerifiableCredential, UniversityDegree, DocumentVerification, degree, name]
    shapes: [Credential, DegreeSubject, Degree]
